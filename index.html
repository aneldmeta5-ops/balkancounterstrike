<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS2 Team Ranking</title>
<style>
:root{--bg:#161b26;--nav:#27334a;--card:#26304a;--card2:#1d2538;--tx:#e6e9f0;--mut:#8f9ab3;--acc:#e8383d;--gold:#f0a830;--line:#35425f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9ecf3;--nav:#2f4468;--card:#fff;--card2:#eef1f7;--tx:#1b2233;--mut:#5d6985;--line:#cfd6e4;color-scheme:light}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",Roboto,sans-serif}
nav{background:var(--nav);display:flex;align-items:stretch;overflow-x:auto;color:#fff}
nav b{background:var(--acc);padding:14px 16px;font-size:18px;letter-spacing:.5px;white-space:nowrap}
nav a{padding:14px 16px;color:#d5dcec;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:18px 12px 40px}
h1{font-size:21px;line-height:1.25;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 14px}
.tools{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:10px 12px;border-radius:4px;font:inherit}
.team{background:var(--card);margin-bottom:8px;border-radius:4px;overflow:hidden}
.hd{display:grid;grid-template-columns:44px 50px 1fr auto;align-items:center;gap:10px;padding:12px;cursor:pointer;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left}
.hd:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.rk{color:var(--mut);font-weight:700;font-size:18px}
.nm{font-size:19px}.nm i{font-style:normal;color:var(--mut);font-size:14px;margin-left:6px}
.nk{color:var(--mut);font-size:13px;margin-top:2px}
.team.open .nk{display:none}
.al{background:var(--gold);color:#1b1b1b;font-weight:700;font-size:13px;padding:2px 8px;border-radius:4px}

.bd{display:none;border-top:1px solid var(--line);padding:14px 12px 4px}
.team.open .bd{display:block;animation:o .18s ease-out}
@keyframes o{from{opacity:0;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.team.open .bd{animation:none}}
.pls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pl{text-align:center;min-width:0}
.pl .ph{aspect-ratio:5/6;background:#3a4252;overflow:hidden;border-radius:2px}
.pl svg,.pl img{width:100%;height:100%;display:block;object-fit:cover}
.pl span{display:block;margin-top:5px;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.acts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:12px}
.acts button{background:none;border:0;color:var(--mut);font:inherit;font-weight:700;padding:14px 4px;cursor:pointer}
.acts button:hover{color:var(--tx)}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
#ov.on{display:flex}
#md{background:var(--card2);border-radius:6px;max-width:460px;width:100%;max-height:88vh;overflow:auto;padding:16px;border:1px solid var(--line)}
#md h2{margin:0 0 4px;font-size:20px}
.row{display:flex;justify-content:space-between;margin-top:12px;font-size:14px}
.bar{height:7px;background:var(--line);border-radius:4px;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:10px;font-size:14px}.kv span:nth-child(odd){color:var(--mut)}
.w,.l{display:inline-block;width:24px;text-align:center;border-radius:3px;font-weight:700;font-size:13px;margin-right:4px;color:#fff}.w{background:#2e9e55}.l{background:#c0392b}
.x{float:right;background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer}
.jr{width:120px;display:block;margin:8px auto 0}
.up{color:#3ec672}.dn{color:#e9585d}nav a{cursor:pointer}nav a.on{color:#fff;box-shadow:inset 0 -3px 0 var(--acc)}.mr{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:14px 12px}.mr span:last-child{text-align:right}.mr small{display:block;color:var(--mut);font-size:12px}.sc{font-size:20px;font-weight:700}.live{background:var(--acc);color:#fff;font-size:12px;padding:1px 6px;border-radius:3px;margin-left:6px}nav{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;top:0;z-index:4;overflow:visible}nav a{padding:0 2px;text-align:center;font-size:clamp(12px,3.7vw,15px);min-height:52px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}

function render(f){f=(f||'').toLowerCase();$('list').innerHTML=teams.filter(t=>!f||t.name.toLowerCase().includes(f)||t.pl.some(p=>p.n.toLowerCase().includes(f))).map(t=>`<div class="team${t.me?' mine':''}" data-r="${t.rank}"><button class="hd" aria-expanded="false"><span class="rk">#${t.rank}</span>${logo(t)}<span><span class="nm">${t.name}<i>(${t.pts} points)</i></span><div class="nk">${t.pl.map(p=>p.n).join(' •')}</div></span><span class="al">AL</span></button><div class="bd"><div class="pls">${t.pl.map(p=>`<div class="pl"><div class="ph">${ph(t,p)}</div><span>${p.n}</span></div>`).join('')}</div><div class="acts"><button data-a="p">Team profile</button><button data-a="d">Ranking details</button></div></div></div>`).join('')||'<p class="sub">No team or player matches that search.</p>'}
$('list').onclick=e=>{const tm=e.target.closest('.team');if(!tm)return;const t=teams[tm.dataset.r-1],a=e.target.dataset.a;
if(e.target.closest('.hd')){const o=tm.classList.toggle('open');tm.querySelector('.hd').setAttribute('aria-expanded',o)}
else if(a)show(t,a)};
function sd(t,k){const r=rng(t.rank*13+(k=='t'?1:2)),mp=['Mirage','Inferno','Nuke','Ancient','Anubis','Dust 2','Overpass'],p=(a,b)=>Math.round(a+r()*b)+'%',w=(k=='t'?t.tr:t.ct)+'%',rows=k=='t'?[['Terrorist win rate',w],['Pistol round win rate',p(40,25)],['Opening duel win rate',p(45,15)],['Bomb plant rate',p(55,20)],['Post-plant win rate',p(60,25)],['Best map',mp[r()*7|0]]]:[['CT win rate',w],['Pistol round win rate',p(40,25)],['Opening duel win rate',p(45,15)],['Retake win rate',p(35,25)],['Defuse rate',p(30,25)],['Best map',mp[r()*7|0]]];return '<div class="kv">'+rows.map(x=>'<span>'+x[0]+'</span><span>'+x[1]+'</span>').join('')+'</div>'}
function show(t,a){const head=`<button class="x" aria-label="Close">×</button><h2>${t.name}</h2><div class="sub">#${t.rank} in Albania &amp; Kosovo · ${t.pts} points <span class="${t.chg<0?'dn':'up'}">${t.chg>0?'▲ '+t.chg:t.chg<0?'▼ '+-t.chg:'–'}</span></div>`;$('md').dataset.r=t.rank;
$('md').innerHTML=head+(a=='p'?`<div style="display:flex;justify-content:center;margin-top:8px">${logo(t,72)}</div><div class="kv"><span>Home city</span><span>${t.city}</span><span>Region</span><span>Albania &amp; Kosovo</span><span>Average age</span><span>${t.age}</span><span>Map win rate</span><span>${t.wr}%</span><span>Current form</span><span>${t.form.map(x=>`<b class="${x=='W'?'w':'l'}">${x}</b>`).join('')}</span><span>Tournaments played</span><span>${t.tp}</span><span>Tournaments won</span><span>${t.tw}</span><span>Roster</span><span>${t.pl.map(p=>p.n).join(', ')}</span></div>`:
[['CT win rate',t.ct],['T win rate',t.tr]].map(([n,v])=>`<div class="row"><span>${n}</span><b>${v}%</b></div><div class="bar"><i style="width:${v}%"></i></div>`).join('')+`<div class="row"><b>Total points</b><b>${t.pts}</b></div><div class="sides"><button data-s="t" aria-pressed="false"><div class="tw"><div class="ag ag19" role="img" aria-label="Terrorist"></div></div><b>Terrorist</b></button><button data-s="ct" aria-pressed="false"><div class="cw"><div class="ag ag14" role="img" aria-label="Counter-Terrorist"></div></div><b>Counter-Terrorist</b></button></div><div id="sd"></div>`);
$('ov').classList.add('on');$('md').querySelector('.x').focus()}
$('ov').onclick=e=>{const sb=e.target.closest('[data-s]');if(sb){document.querySelectorAll('.sides button').forEach(x=>{const on=x==sb;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});$('sd').innerHTML=sd(teams[$('md').dataset.r-1],sb.dataset.s);return}if(e.target.id=='ov'||e.target.closest('.x'))$('ov').classList.remove('on')};
document.onkeydown=e=>{if(e.key=='Escape')$('ov').classList.remove('on')};
const AGN=29;teams.forEach(t=>{const pool=[...Array(AGN).keys()].sort(()=>R()-.5);let k=0;t.pl.forEach(p=>{p.ag=pool[k++%AGN]})});
const ev=[['Albanian Premier Series Fall 2026','$25,000','Oct 24 – 25 · Grand Final Oct 25, 19:00','Tirana',1],['Balkan Clash Open','$10,000','Nov 8 – 10','Online'],['Dukagjini Cup','$15,000','Nov 20 – 24','Prishtina'],['Adriatic Masters','$40,000','Dec 5 – 14','Durrës']];
const tn=()=>teams[R()*teams.length|0],pair=()=>{let a=tn(),b=tn();while(b==a)b=tn();return[a,b]};
const MT=Array.from({length:7},(_,i)=>{const[a,b]=i?pair():[teams[6],teams[R()*5|0]];return{a,b,t:['Oct 25 · 17:00','Oct 25 · 19:30','Oct 26 · 16:00','Oct 26 · 18:30','Oct 27 · 17:00','Oct 28 · 20:00','Oct 29 · 18:00'][i],e:ev[i%4][0]}});
const RS=Array.from({length:8},(_,i)=>{const[a,b]=i?pair():[teams[6],teams[7+(R()*6|0)]],y=R()<.5?0:1;return{a,b,s:i<5||!i?[2,y]:[y,2],e:ev[i%4][0],d:['Oct 23','Oct 23','Oct 22','Oct 22','Oct 21','Oct 20','Oct 19','Oct 18'][i]}});
const card=(h,c)=>`<div class="team ${c||''}">${h}</div>`;
let curV='ranking';const SLOT=2400000,SC=new Map(),MAPS=['Mirage','Inferno','Nuke','Ancient','Anubis','Dust 2','Overpass'];
function core(n,fin){const r=rng(n*7919+13);let a,b;if(fin){a=teams.find(t=>t.me);b=teams.find(t=>t.tag=='DAR')}else{a=teams[r()*teams.length|0];do{b=teams[r()*teams.length|0]}while(b==a)}
const p=.5+(a.pts-b.pts)/3500,pool=[...MAPS].map(x=>[r(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]),sc=[0,0],maps=[],T=[];let tt=0;
while(sc[0]<2&&sc[1]<2){const g=[0,0],seq=[];while(g[0]<13&&g[1]<13){const w=r()<p?0:1;g[w]++;seq.push(w);tt+=120000+(r()*30000|0);T.push(tt)}sc[g[0]>g[1]?0:1]++;maps.push({n:pool[maps.length],seq,g});tt+=60000}
return{n,a,b,maps,T,dur:tt,start:0,end:0,e:''}}
const HR=3600000,FS=Date.parse('2026-10-25T19:00:00+02:00'),A0=Date.parse('2026-10-24T14:00:00+02:00'),SCH=[];
(function(){const gr=rng(4242),fin=core(9999,1);fin.start=FS;fin.end=FS+fin.dur;fin.fin=1;fin.e=ev[0][0];let t=A0,i=0,done=0;
while(SCH.length<60){const m=core(i++);m.start=t;m.end=t+m.dur;if(!done&&m.end>FS-4*HR){SCH.push(fin);done=1;t=fin.end+4*HR;continue}
m.e=done?ev[1+i%3][0]:ev[0][0];SCH.push(m);t=m.end+(4+gr()*20)*HR}})();
function st(m,now){const el=now-m.start;let k=0;while(k<m.T.length&&m.T[k]<=el)k++;const rt=Math.min(150,Math.max(0,(Math.min(el,m.dur)-(k?m.T[k-1]:0))/1000|0));let w=[0,0],cur=null;
for(let i=0;i<m.maps.length;i++){const mp=m.maps[i];if(k>=mp.seq.length){k-=mp.seq.length;w[mp.g[0]>mp.g[1]?0:1]++;continue}const g=[0,0];for(let j=0;j<k;j++)g[mp.seq[j]]++;cur={n:mp.n,g,i};break}return{w,cur,rt}}
const hm=ms=>new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),p2=x=>String(x).padStart(2,'0');
function liveCard(m,now){const s=st(m,now),c=s.cur;return card(`<div class="mr"><span>${m.fin?'<span class="fb">\ud83c\udfc6 GRAND FINAL</span><br>':''}${m.a.name}<small>${m.e}</small></span><span class="sc">${c?c.g[0]+' : '+c.g[1]:s.w[0]+' \u2013 '+s.w[1]}<small style="color:var(--acc);font-weight:700">\u25cf LIVE \u00b7 maps ${s.w[0]}\u2013${s.w[1]}</small>${c?`<small>${c.n} \u00b7 round ${c.g[0]+c.g[1]+1} \u00b7 ${s.rt/60|0}:${p2(s.rt%60)}</small>`:''}</span><span>${m.b.name}<small>BO3</small></span></div>`,m.fin?'hl':'')}
function upCard(m,now){const d=Math.max(0,Math.round((m.start-now)/1000)),c=(d>=3600?p2(d/3600|0)+':':'')+p2(d%3600/60|0)+':'+p2(d%60);return card(`<div class="mr"><span>${m.fin?'<span class="fb">\ud83c\udfc6 GRAND FINAL</span><br>':''}${m.a.name}<small>${m.e}</small></span><span><b>vs</b><small>${hm(m.start)} \u00b7 in ${c}</small></span><span>${m.b.name}<small>BO3</small></span></div>`,m.fin?'hl':'')}
function finCard(m){const s=st(m,m.end);return card(`<div class="mr"><span>${m.fin?'<span class="fb">\ud83c\udfc6 GRAND FINAL</span><br>':''}${m.a.name}<small>${hm(m.end)}</small></span><span class="sc">${s.w[0]} \u2013 ${s.w[1]}<small>${m.maps.map(x=>x.g.join(':')).join(', ')}</small></span><span>${m.b.name}<small>${m.e}</small></span></div>`,m.fin?'hl':'')}
const V={news:()=>'<h1>News</h1>'+[['Shqiponjat climb to #7 in the Albania & Kosovo ranking','Oct 24','The roster has won five of its last seven maps and moves into the top half of the table.'],[teams[0].name+' stay on top with '+teams[0].pts+' points','Oct 24','Illyria-style consistency at LAN keeps the lead over '+teams[1].name+'.'],['Albanian Premier Series Fall 2026 kicks off in Tirana','Oct 24','Eight teams play for a $25,000 prize pool over ten days.'],[teams[3].name+' sign a new rifler ahead of the Balkan Clash Open','Oct 22','The move is the first roster change for the team this season.']].map(([h,d,b])=>card(`<div class="bd" style="display:block;border:0"><b>${h}</b><div class="nk">${d}</div><p class="sub" style="margin:6px 0 0">${b}</p></div>`)).join(''),
matches:()=>{const now=Date.now(),L=SCH.filter(m=>m.start<=now&&m.end>now),U=SCH.filter(m=>m.start>now);
return '<h1>Live matches</h1>'+(L.length?L.map(m=>liveCard(m,now)).join(''):'<p class="sub">No live matches right now. The next one starts soon.</p>')+'<h1 style="margin-top:22px">Upcoming matches</h1>'+U.slice(0,6).map(m=>upCard(m,now)).join('')},
results:()=>{const now=Date.now(),F=SCH.filter(m=>m.end<=now).reverse().slice(0,6);return '<h1>Results</h1>'+F.map(finCard).join('')+RS.map(m=>card(`<div class="mr"><span>${m.a.name}<small>${m.d}</small></span><span class="sc">${m.s[0]} – ${m.s[1]}</span><span>${m.b.name}<small>${m.e}</small></span></div>`)).join('')},
events:()=>'<h1>Events</h1>'+ev.map(e=>card(`<div class="mr" style="grid-template-columns:1fr auto"><span><b>${e[0]}</b>${e[4]?'<i class="live" style="font-style:normal">LIVE</i>':''}<small>${e[2]} · ${e[3]}</small></span><span class="sc">${e[1]}</span></div>`)).join('')};
const vo=document.createElement('main');vo.hidden=true;document.body.insertBefore(vo,$('ov'));
function go(v){if(!V[v]&&v!='ranking')v='ranking';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==v));curV=v;$('v-rank').hidden=v!='ranking';vo.hidden=v=='ranking';if(v!='ranking')vo.innerHTML=V[v]();scrollTo(0,0)}
$('nav').onclick=e=>{const a=e.target.closest('a');if(a){e.preventDefault();go(a.dataset.v)}else if(e.target.closest('b'))go('ranking')};
$('q').oninput=e=>render(e.target.value);render();go(location.hash.slice(1));setInterval(()=>{if(curV=='matches'||curV=='results')vo.innerHTML=V[curV]()},1000);
</script></body></html>
